<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taplink — Panel</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0b0b0c; color: #fff; margin: 0; min-height: 100vh;
  }
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card { max-width: 340px; width: 100%; text-align: center; }
  .gate-card h1 { font-size: 18px; margin-bottom: 20px; }
  .gate-card input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #333;
    background: #17181a; color: #fff; font-size: 16px; margin-bottom: 12px;
  }
  .gate-card button, .refresh {
    width: 100%; padding: 12px; background: #fff; color: #0b0b0c; border: none;
    border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .gate-err { color: #ff6b6b; font-size: 13px; margin-top: 10px; min-height: 16px; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; display: none; }
  .wrap.show { display: block; }
  header.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  header.top h1 { font-size: 20px; margin: 0; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: #141416; border: 1px solid #262626; border-radius: 10px; padding: 14px 18px; min-width: 110px; }
  .stat .n { font-size: 24px; font-weight: 800; }
  .stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.5); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #222; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.5); font-weight: 600; }
  td a { color: #9cc4ff; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .badge.activo { background: #123b23; color: #4ade80; }
  .badge.pausado { background: #3b2f12; color: #facc15; }
  .badge.cancelado { background: #3b1212; color: #f87171; }
  .empty { color: rgba(255,255,255,.5); padding: 40px 0; text-align: center; }
  .refresh { width: auto; padding: 10px 18px; font-size: 13px; }
  .muted { color: rgba(255,255,255,.4); font-size: 12px; }
  .estado-select {
    background: #17181a; color: #fff; border: 1px solid #333; border-radius: 6px;
    padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  .estado-select:disabled { opacity: .5; cursor: wait; }
  details summary { cursor: pointer; color: #6ea8ff; font-size: 12px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .envio-datos { margin-top: 6px; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,.75); white-space: nowrap; }
  .manual-tag { font-size: 11px; color: #ffb347; white-space: nowrap; }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>Panel privado — Taplink</h1>
      <input type="password" id="pw" placeholder="Contraseña" />
      <button onclick="entrar()">Entrar</button>
      <p class="gate-err" id="gateErr"></p>
    </div>
  </div>

  <div class="wrap" id="wrap">
    <header class="top">
      <h1>Locales</h1>
      <button class="refresh" onclick="cargar()">Actualizar</button>
    </header>
    <div class="stats" id="stats"></div>
    <div id="tableWrap"></div>
  </div>

<script>
function entrar() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  sessionStorage.setItem('panel_pw', pw);
  cargar();
}

document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });

async function cargar() {
  const pw = sessionStorage.getItem('panel_pw');
  if (!pw) return;

  const res = await fetch('/panel-datos', { headers: { 'x-panel-password': pw } });

  if (res.status === 401) {
    sessionStorage.removeItem('panel_pw');
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('wrap').classList.remove('show');
    document.getElementById('gateErr').textContent = 'Contraseña incorrecta.';
    return;
  }

  const data = await res.json().catch(() => ({}));
  document.getElementById('gate').style.display = 'none';
  document.getElementById('wrap').classList.add('show');

  if (!res.ok) {
    document.getElementById('stats').innerHTML = '';
    document.getElementById('tableWrap').innerHTML =
      '<p class="empty" style="color:#f87171">Error al cargar los datos: ' + escapeHtml(data.error || res.status) + '</p>';
    return;
  }

  render(data.locales || []);
}

function render(locales) {
  const activos = locales.filter(l => l.estado === 'activo').length;
  const pausados = locales.filter(l => l.estado === 'pausado').length;
  const cancelados = locales.filter(l => l.estado === 'cancelado').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${locales.length}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${activos}</div><div class="l">Activos</div></div>
    <div class="stat"><div class="n">${pausados}</div><div class="l">Pausados</div></div>
    <div class="stat"><div class="n">${cancelados}</div><div class="l">Cancelados</div></div>
  `;

  if (!locales.length) {
    document.getElementById('tableWrap').innerHTML = '<p class="empty">Todavía no hay ningún local dado de alta.</p>';
    return;
  }

  const rows = locales.map(l => {
    const link = location.origin + '/go/' + l.slug;
    const fecha = l.creado ? new Date(l.creado).toLocaleDateString('es-ES') : '—';
    const slugAttr = escapeHtml(l.slug || '');
    const errores = l.email_errors || {};
    const errorKeys = Object.keys(errores);
    const emailHtml = errorKeys.length
      ? `<details><summary style="color:#f87171">⚠️ Error</summary><div class="envio-datos">${
          errorKeys.map(k => escapeHtml(k) + ': ' + escapeHtml(errores[k].mensaje || '')).join('<br>')
        }</div></details>`
      : '<span style="color:#4ade80">✅ OK</span>';
    const tieneEnvio = l.direccion || l.nombre_cliente || l.nif || l.telefono;
    const envioHtml = tieneEnvio ? `
      <details>
        <summary>Ver datos</summary>
        <div class="envio-datos">
          ${l.nombre_cliente ? escapeHtml(l.nombre_cliente) + '<br>' : ''}
          ${l.nif ? 'NIF: ' + escapeHtml(l.nif) + '<br>' : ''}
          ${l.direccion ? escapeHtml(l.direccion) + '<br>' : ''}
          ${(l.cp || l.ciudad) ? escapeHtml((l.cp || '') + ' ' + (l.ciudad || '')) + '<br>' : ''}
          ${l.telefono ? 'Tel: ' + escapeHtml(l.telefono) : ''}
        </div>
      </details>` : '—';
    return `
      <tr>
        <td>${escapeHtml(l.nombre_local || '—')}</td>
        <td>${escapeHtml(l.codigo || '—')}</td>
        <td><span class="badge ${l.estado}">${l.estado || '—'}</span>${l.manual ? ' <span class="manual-tag" title="Fijado a mano: Stripe no puede cambiarlo hasta que elijas Automático">🔒 manual</span>' : ''}</td>
        <td><a href="${link}" target="_blank">${link.replace('https://','')}</a></td>
        <td>${l.review_url ? '<a href="' + l.review_url + '" target="_blank">ver reseñas</a>' : '—'}</td>
        <td>${envioHtml}</td>
        <td>${emailHtml}</td>
        <td class="muted">${fecha}</td>
        <td>
          <select class="estado-select" data-slug="${slugAttr}" onchange="cambiarEstado(this)">
            <option value="activo" ${l.estado === 'activo' ? 'selected' : ''}>Activo</option>
            <option value="pausado" ${l.estado === 'pausado' ? 'selected' : ''}>Pausado</option>
            <option value="cancelado" ${l.estado === 'cancelado' ? 'selected' : ''}>Cancelado</option>
            <option value="auto">↺ Volver a automático (Stripe)</option>
          </select>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead><tr><th>Local</th><th>Código</th><th>Estado</th><th>Link de la placa</th><th>Reseñas</th><th>Envío / facturación</th><th>Email</th><th>Alta</th><th>Cambiar estado</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function cambiarEstado(select) {
  const slug = select.dataset.slug;
  const estado = select.value;
  const pw = sessionStorage.getItem('panel_pw');
  select.disabled = true;
  try {
    const res = await fetch('/panel-set-estado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-panel-password': pw },
      body: JSON.stringify({ slug, estado })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert('No se pudo cambiar el estado: ' + (data.error || res.status));
    }
  } catch (e) {
    alert('No se pudo conectar para cambiar el estado.');
  }
  await cargar();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Si ya había una contraseña guardada en esta pestaña, entra directo
if (sessionStorage.getItem('panel_pw')) cargar();
</script>
</body>
</html>
